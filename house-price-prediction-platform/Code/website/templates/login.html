<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Prevemos</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='styles/login.css') }}">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
  </head>
  <body>
    <div class="container" id="container">
        <div class="form-container sign-up-container">
            <form action="/register" id="signup-form" method="post">
                <h1>Criar Conta</h1>
                <input class="teste" type="text" name="name" placeholder="Nome" />
                <input class="teste" type="email" name="email" placeholder="Email" />
                <input class="teste" type="password" name="password" placeholder="Palavra-passe" />
                <button>Registar</button>
                <p class="error" id="signup-message"></p>
            </form>
        </div>
        <div class="form-container sign-in-container">
            <form action="/login" id="login-form" method="post">
                <h1>Login</h1>
                <input class="teste" type="email" name="email" placeholder="Email" />
                <input class="teste" type="password" name="password" placeholder="Palavra-passe" />
                <a href="/reset"><u>Esqueceu-se da palavra-passe?</u></a>
                <button type="submit">Login</button>
                <div>
                    <p class="error" id="login-message"></p>
                    <input type="checkbox" id="remember-me" name="remember-me" value="yes"> <label for="remember-me">Manter-me Logado</label>
                </div>
                
                
            </form>
        </div>
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Faça já o seu Login!</h1>
                    <p>Introduza os seus dados, e torne-se especialista no mercado português!</p>
                    <button class="ghost" id="signIn">Login</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>Bem vindo ao Prevemos!</h1>
                    <p>Introduza os seus dados, e torne-se especialista no mercado português!</p>
                    <button class="ghost" id="signUp">Registar</button>
                </div>
            </div>
        </div>
    </div>
    <script type ="text/javascript" src="{{ url_for('static',filename='scripts/login.js') }}"></script>
  </body>
</html>
