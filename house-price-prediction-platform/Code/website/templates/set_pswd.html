<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Prevemos</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='styles/set_pswd.css') }}">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
  </head>
  <body>
    <div class="container" id="container">
        <div class="form-container">
            <form action="/reset" id="reset-form" method="post">
                <h1>Repor Palavra-Passe</h1>
                <input type="password" name="password" placeholder="Nova palavra-passe" />
                <input type="hidden" id="token" name="token" value="3487">
                <button>Repor palavra-passe</button>
                <p style="font-weight: bold; color: #ff0d0d;" id="reset-message"></p>
            </form>
        </div>
    </div>
    <script type ="text/javascript" src="{{ url_for('static',filename='scripts/change_pass.js') }}"></script>
  </body>
</html>
